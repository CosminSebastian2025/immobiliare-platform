version: "3.8"

services:
    db:
        image: postgres:18.6
        container_name: immobiliare_db
        environment:
            POSTGRES_USER: ${POSTGRESQL_USER}
            POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
            POSTGRES_DB: ${POSTGRESQL_DB}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        
    adminer:
        image: adminer
        container_name: immobiliare_adminer
        ports:
            - "5050:5050"

volumes:
    postgres_data:
